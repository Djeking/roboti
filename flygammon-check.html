<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flygammon CTF solver</title><style>body{font:16px system-ui;max-width:960px;margin:40px auto;padding:0 20px;background:#10151d;color:#e5edf7}button{padding:12px 20px;font-size:16px;cursor:pointer;background:#72e0ba;border:0;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#192333;padding:20px;border-radius:8px}a{color:#8dc9ff}</style><h1>Flygammon — диагностика подключения</h1><p>Клиент обращается напрямую к твоему CTF-инстансу. На этом шаге транзакции не отправляются.</p><button id="probe">Прочитать параметры игры</button> <button id="copy">Скопировать результат</button><pre id="out">Нажми «Прочитать параметры игры».</pre><script>
const RPC='https://igcl31v04n5dvcmu.instances.ctfcup.online/';
const CONTRACT='0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0';
const fields={P:'8b8fbd92',G:'6fecb623',H:'70a5d861',N:'c9e525df',tokens:'9d63848a',streak:'b3ab4f70',gameId:'d7c81b55',turn:'8b299903',playerToMove:'2ee25c51',committed:'9b6b9664',dicePosted:'3b8c9faa',boardPacked:'dc853352',isSolved:'64d98f6e'};
const out=document.getElementById('out');
document.getElementById('probe').onclick=async()=>{out.textContent='Подключение…';try{const names=Object.keys(fields);const body=names.map((n,i)=>({jsonrpc:'2.0',id:i,method:'eth_call',params:[{to:CONTRACT,data:'0x'+fields[n]},'latest']}));body.unshift({jsonrpc:'2.0',id:100,method:'eth_chainId',params:[]});const r=await fetch(RPC,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();out.textContent=JSON.stringify(j,null,2);}catch(e){out.textContent='Ошибка прямого подключения: '+e+'\nЕсли браузер блокирует CORS, запусти probe.py на своём компьютере и пришли его вывод.';}};
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(out.textContent);out.textContent+='\n\nСкопировано.';}catch(e){const r=document.createRange();r.selectNodeContents(out);getSelection().removeAllRanges();getSelection().addRange(r);}};
</script></html>
